<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-labelledby="t">
  <title id="t">Principe d'un inverseur de source entre le réseau CIE et un groupe électrogène</title>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1F44"/></marker>
    <style>
      .n{font:600 15px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0A1F44}
      .s{font:400 12.5px Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#4A5970}
      .l{fill:none;stroke:#0A1F44;stroke-width:2}
      .d{fill:none;stroke:#0A7A24;stroke-width:2;stroke-dasharray:6 5}
    </style>
  </defs>
  <rect x="16" y="24" width="180" height="62" rx="6" fill="#fff" stroke="#0B357A" stroke-width="2"/>
  <text class="n" x="32" y="50">Réseau CIE</text>
  <text class="s" x="32" y="70">source principale</text>
  <rect x="16" y="118" width="180" height="62" rx="6" fill="#fff" stroke="#F88000" stroke-width="2"/>
  <text class="n" x="32" y="144">Groupe électrogène</text>
  <text class="s" x="32" y="164">source de secours</text>
  <path class="l" d="M196 55H226V86H252" marker-end="url(#f)"/>
  <path class="l" d="M196 149H226V118H252" marker-end="url(#f)"/>
  <rect x="254" y="58" width="190" height="88" rx="6" fill="#0A1F44"/>
  <text class="n" x="270" y="86" style="fill:#fff">Inverseur automatique</text>
  <text class="s" x="270" y="108" style="fill:#A9B6CC">bascule à la coupure,</text>
  <text class="s" x="270" y="126" style="fill:#A9B6CC">revient au retour du réseau</text>
  <path class="l" d="M444 102H490" marker-end="url(#f)"/>
  <rect x="492" y="70" width="132" height="64" rx="6" fill="#fff" stroke="#D5DCE7" stroke-width="1.5"/>
  <text class="n" x="508" y="97">Vos</text>
  <text class="n" x="508" y="117">équipements</text>
  <path class="d" d="M349 146V206"/>
  <rect x="254" y="208" width="190" height="64" rx="6" fill="#fff" stroke="#0A7A24" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="n" x="270" y="235">Onduleur et batteries</text>
  <text class="s" x="270" y="255">option, voir Photovoltaïque</text>
  <path class="d" d="M444 240H558V136" marker-end="url(#f)"/>
</svg>
